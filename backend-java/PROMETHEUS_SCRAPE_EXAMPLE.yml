global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spotu-backend-java"
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - spotu-api:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

